<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FF4438">
<title>Yanobeam — Firwood road reports</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF4438'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fff'/%3E%3Cpath d='M16 8a8 8 0 0 1 8 8M16 3a13 13 0 0 1 13 13' stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== icon symbols ===== -->
<svg class="symbols" aria-hidden="true"><defs>
  <symbol id="ic-crash" viewBox="0 0 48 48">
    <g fill="#fff">
      <rect x="4" y="26" width="19" height="8" rx="3"/>
      <path d="M7 26 L10 19 H17 L20 26 Z"/>
      <circle cx="9.5" cy="35" r="3.4"/><circle cx="19" cy="35" r="3.4"/>
      <rect x="25" y="26" width="19" height="8" rx="3"/>
      <path d="M28 26 L31 19 H38 L41 26 Z"/>
      <circle cx="29" cy="35" r="3.4"/><circle cx="38.5" cy="35" r="3.4"/>
    </g>
    <g stroke="#fff" stroke-width="2.4" stroke-linecap="round">
      <path d="M24 8v5"/><path d="M17.5 11l3 3"/><path d="M30.5 11l-3 3"/>
      <path d="M13.5 19h4"/><path d="M34.5 19h-4"/>
    </g>
  </symbol>

  <symbol id="ic-stopped" viewBox="0 0 48 48">
    <path d="M24 5.5 L45.5 42.5 H2.5 Z" fill="#F59E0B" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>
    <g fill="#fff">
      <rect x="13" y="26" width="22" height="7" rx="2.5"/>
      <path d="M16.5 26 L19.5 20.5 H28.5 L31.5 26 Z"/>
      <circle cx="18" cy="34" r="3"/><circle cx="30" cy="34" r="3"/>
    </g>
  </symbol>

  <symbol id="ic-police" viewBox="0 0 48 48">
    <g fill="#fff">
      <rect x="12" y="17" width="26" height="10" rx="4"/>
      <rect x="36" y="19" width="5" height="6" rx="2"/>
      <rect x="17" y="12" width="9" height="5" rx="2"/>
      <path d="M15 27 L12 40 H21 L23 27 Z"/>
    </g>
    <g stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round">
      <path d="M43.5 15a8 8 0 0 1 0 14"/>
      <path d="M46 11.5a13 13 0 0 1 0 21"/>
    </g>
  </symbol>

  <symbol id="ic-uc" viewBox="0 0 48 48">
    <g fill="#22262C">
      <rect x="5" y="26" width="38" height="9" rx="4"/>
      <path d="M12 26 L16.5 17.5 H30.5 L35 26 Z"/>
      <circle cx="14" cy="36" r="4"/><circle cx="34" cy="36" r="4"/>
    </g>
  </symbol>

  <symbol id="ic-pin" viewBox="0 0 24 24">
    <path d="M12 2C7.6 2 4 5.6 4 10c0 5.8 6.9 11.9 7.4 12.4a.7.7 0 0 0 .9 0C12.8 21.9 20 15.8 20 10c0-4.4-3.6-8-8-8z" fill="#FF4438"/>
    <circle cx="12" cy="10" r="3" fill="#fff"/>
  </symbol>
  <symbol id="ic-mag" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2.2" fill="none"/>
    <path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-loc" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-bang" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2.4" fill="none"/>
    <rect x="10.8" y="6.5" width="2.4" height="7.5" rx="1.2" fill="#fff"/>
    <circle cx="12" cy="17.2" r="1.5" fill="#fff"/>
  </symbol>
  <symbol id="ic-x" viewBox="0 0 24 24">
    <path d="M7 7l10 10M17 7L7 17" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-wheel" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M12 15v6M9.5 10.5 3.6 8M14.5 10.5l5.9-2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
</defs></svg>

<!-- ===== top bar ===== -->
<header id="top">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="4" fill="#fff"/>
      <path d="M16 8a8 8 0 0 1 8 8M16 3a13 13 0 0 1 13 13" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
  </div>
  <div class="brand">Yanobeam <span class="chip">beta</span></div>
  <div class="search">
    <svg class="mag" width="16" height="16"><use href="#ic-mag"/></svg>
    <input id="q" type="text" placeholder="Search Firwood… (dock, sawmill, main st)" autocomplete="off" spellcheck="false">
    <div id="results" hidden></div>
  </div>
  <div class="online"><i></i><span id="onlineN">287</span> online</div>
  <div class="avatar" title="you"><svg width="18" height="18"><use href="#ic-wheel"/></svg></div>
</header>

<!-- ===== map ===== -->
<div id="mapWrap">
  <div id="mapLayer">
    <img id="mapImg" alt="East Coast, USA — top map" draggable="false" src="map.png">
    <div id="markers"></div>
    <div id="you"><i></i></div>
    <div id="pin" hidden>
      <svg viewBox="0 0 40 48" width="40" height="48">
        <path d="M20 2C10.6 2 3 9.6 3 19c0 12.4 14.6 25.4 16.1 26.7a1 1 0 0 0 1.8 0C23.4 44.4 38 31.4 38 19 38 9.6 30.4 2 20 2z" fill="#FF4438" stroke="#fff" stroke-width="3"/>
        <circle cx="20" cy="19" r="6.5" fill="#fff"/>
      </svg>
    </div>
  </div>

  <div id="banner" class="ui" hidden>
    <span>Tap the map to drop your pin</span>
    <button id="bannerX" aria-label="Cancel">×</button>
  </div>

  <div id="ctrls" class="ui">
    <button id="zin" class="ctrl" aria-label="Zoom in">+</button>
    <button id="zout" class="ctrl" aria-label="Zoom out">−</button>
    <button id="loc" class="ctrl" aria-label="My position"><svg width="20" height="20"><use href="#ic-loc"/></svg></button>
  </div>

  <div id="scale" aria-hidden="true"><span class="bar" id="sBar"></span><span class="txt" id="sTxt">200 m</span></div>

  <div id="popup" class="ui" hidden></div>

  <div id="confirm" class="ui" hidden>
    <svg class="cIco" width="20" height="20"><use href="#ic-pin"/></svg>
    <div class="cTxt"><b>Position set</b><small id="posTxt">—</small></div>
    <button id="cCancel" class="ghost">Cancel</button>
    <button id="cOk" class="prim">Confirm position</button>
  </div>
</div>

<!-- ===== bottom ===== -->
<div id="foot">
  <span id="footL">Firwood, Maine</span>
  <span id="footR" hidden>★ <b id="pts">0</b></span>
</div>

<button id="fab" class="ui" aria-label="Report something">
  <svg class="bang" width="30" height="30"><use href="#ic-bang"/></svg>
  <svg class="xIco" width="28" height="28" hidden><use href="#ic-x"/></svg>
</button>

<!-- ===== report sheet ===== -->
<div id="sheet" role="dialog" aria-label="Send a report">
  <div class="grab"></div>
  <div class="sHead"><h2>What did you spot?</h2><button id="sClose" aria-label="Close">×</button></div>
  <div class="posLine"><svg width="12" height="12"><use href="#ic-pin"/></svg><span id="posTxt2">—</span><em>· position confirmed</em></div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="warnings" role="tab">Warnings</button>
    <button class="tab" data-tab="police" role="tab">Police</button>
  </div>

  <div class="pane" data-pane="warnings">
    <div class="opts">
      <button class="opt" data-type="crash">
        <span class="badge" style="background:#E8352B"><svg viewBox="0 0 48 48"><use href="#ic-crash"/></svg></span>
        <span class="lbl">Car crash</span>
      </button>
      <button class="opt" data-type="stopped">
        <span class="badge tri"><svg viewBox="0 0 48 48"><use href="#ic-stopped"/></svg></span>
        <span class="lbl">Stopped car</span>
      </button>
    </div>
  </div>

  <div class="pane" data-pane="police" hidden>
    <div class="opts" id="policeOpts">
      <button class="opt" data-type="police">
        <span class="badge" style="background:#2F6FED"><svg viewBox="0 0 48 48"><use href="#ic-police"/></svg></span>
        <span class="lbl">Police control</span>
      </button>
      <button class="opt" data-type="undercover">
        <span class="badge" style="background:#8A9099"><svg viewBox="0 0 48 48"><use href="#ic-uc"/></svg></span>
        <span class="lbl">Undercover</span>
      </button>
    </div>

    <div id="brandPick" hidden>
      <button class="flat back" id="brandBack">‹ &nbsp;Back to police</button>
      <button class="flat" data-brand="ETK"><b>ETK</b><i>ETK</i></button>
      <button class="flat" data-brand="BRKL"><b>BRKL</b><i>Bruckell</i></button>
      <button class="flat" data-brand="GVRL"><b>GVRL</b><i>Gavril</i></button>
      <button class="flat" data-brand="OTHERS">
        <span class="mini"><svg viewBox="0 0 48 48"><use href="#ic-uc"/></svg></span><i>Others</i>
      </button>
    </div>
  </div>

  <button id="send" disabled>SEND REPORT</button>
  <p class="sFoot">Yanobeam 0.4 “Firwood” · fan project — not affiliated with BeamNG or Yanosik</p>
</div>

<script src="app.js"></script>
</body>
</html>
